<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">SQLiteLens</title><desc id="d">A database cylinder opens into tables and query results.</desc><defs><linearGradient id="bg"><stop stop-color="#17293e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#62e3c1" stroke-width="3" fill="#142f43"><ellipse cx="240" cy="100" rx="100" ry="30"/><path d="M140 100V205C140 245 340 245 340 205V100"/><path d="M140 150C140 190 340 190 340 150M140 200C140 240 340 240 340 200" fill="none"/></g><path d="M360 165H530" stroke="#8fa8ff" stroke-width="3" stroke-dasharray="9 8"><animate attributeName="stroke-dashoffset" values="0;-68" dur="2.5s" repeatCount="indefinite"/></path><g fill="#152b43" stroke="#8fa8ff" stroke-width="2"><rect x="550" y="80" width="220" height="55" rx="8"/><rect x="550" y="145" width="220" height="55" rx="8"/><rect x="550" y="210" width="220" height="40" rx="8"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="580" y="114">TABLES</text><text x="580" y="179">SCHEMA</text><text x="580" y="237">QUERY</text></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">SQLITELENS</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">EXPLORE / QUERY / EXPORT</text></svg>